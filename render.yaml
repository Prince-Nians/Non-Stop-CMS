# Render Blueprint (FREE plan, demo setup): the admin (CMS).
# It uses the SAME Postgres database as nonstop-backend (created by that repo's blueprint), so deploy the backend first.
# Values marked `sync: false` are asked for when you apply the blueprint.
services:
  - type: web
    name: nonstop-cms
    runtime: docker
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: Non Stop CMS
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY_SEED          # the container derives a stable APP_KEY from this
        generateValue: true
      # APP_URL defaults to the service's own address (RENDER_EXTERNAL_URL) when not set
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        sync: false                # Render > nonstop-db > Connections > "Internal Database URL"
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: SESSION_DRIVER
        value: database            # logins survive redeploys (the backend's migrations create the sessions table)
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: RUN_MIGRATIONS
        value: "false"             # the schema belongs to nonstop-backend
      - key: RUN_SEED
        value: "true"              # creates the first admin only if it does not exist yet
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Uploads are kept in the shared database; the BACKEND serves them. Paste the backend address + /media
      - key: PUBLIC_DISK_DRIVER
        value: database
      - key: PUBLIC_DISK_URL
        sync: false                # https://<your-backend>.onrender.com/media
      # After every content change the CMS asks the website to refresh
      - key: FRONTEND_REVALIDATE_URL
        sync: false                # https://<your-site>.vercel.app/api/revalidate
      - key: REVALIDATE_SECRET
        sync: false                # must equal REVALIDATE_SECRET in Vercel
